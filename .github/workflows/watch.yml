name: Summer 2027 internship watch
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internship-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check boards and append new matches
        run: python agent.py --log internships_log.md
      - name: Save new postings
        run: |
          git config user.name "Internship Tracker Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internships_log.md
          git diff --cached --quiet || (git commit -m "Log new internship postings [automated]" && git push)
